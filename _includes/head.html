<head>
  <link href="http://gmpg.org/xfn/11" rel="profile">
  <meta http-equiv="content-type" content="text/html; charset=utf-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <meta name="theme-color" content="#17202a">
  <meta name="color-scheme" content="light dark">
  
   <!-- Basic meta elements -->
  <meta charset="utf-8" />
  
  <!-- Enable responsiveness on mobile devices -->
  <meta name="viewport" content="width=device-width,initial-scale=1.0,shrink-to-fit=no" />

  {% if page.url %}
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  {% endif %}

  {% if page.robots == "noindex" or paginator.page > 1 %}
  <meta name="robots" content="noindex,follow">
  {% endif %}

  <script>
    (function() {
      var storageKey = 'theme';
      var lightClass = 'theme-nord-light';
      var darkClass = 'theme-nord-dark';
      var colorClass = 'theme-nord-color';
      var root = document.documentElement;
      var saved = null;

      function normalizeTheme(value) {
        return value === 'color' || value === 'dark' || value === 'light' ? value : null;
      }

      try {
        saved = normalizeTheme(localStorage.getItem(storageKey));
      } catch (e) {
        saved = null;
      }

      if (!saved) {
        saved = 'light';
      }

      root.classList.remove(lightClass, darkClass, colorClass);
      root.classList.add(saved === 'dark' ? darkClass : saved === 'light' ? lightClass : colorClass);
    })();
  </script>

  <link rel="stylesheet" href="{{ '/assets/css/nord.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/briefing.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css" integrity="sha384-wcIxkf4k558AjM3Yz3BBFQUbk/zgIYC2R0QpeeYb+TwlBVMrlgLqwRjRtGZiK7ww" crossorigin="anonymous">
  
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Source+Code+Pro:wght@400;500;600&family=UnifrakturMaguntia&display=swap">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  <link rel="apple-touch-icon-precomposed" sizes="144x144" href="{{ '/assets/apple-touch-icon-precomposed.png' | relative_url }}">

  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js" integrity="sha384-hIoBPJpTUs74ddyc4bFZSM1TVlQDA60VBbJS0oA934VSz82sBx1X7kSx2ATBDIyd" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js" integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk" crossorigin="anonymous"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (typeof renderMathInElement !== 'function') {
        return;
      }
      renderMathInElement(document.body, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '$', right: '$', display: false },
          { left: '\\(', right: '\\)', display: false },
          { left: '\\[', right: '\\]', display: true }
        ],
        throwOnError: false
      });
    });
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var germanHosts = [
        'tagesschau.de', 'deutschlandfunk.de', 'zeit.de', 'faz.net',
        'handelsblatt.com', 'sueddeutsche.de', 'dw.com', 'bundesregierung.de'
      ];

      function isGermanHost(hostname) {
        return germanHosts.some(function (host) {
          return hostname === host || hostname.slice(-(host.length + 1)) === '.' + host;
        });
      }

      function translateUrl(rawUrl) {
        var url;
        try {
          url = new URL(rawUrl);
        } catch (error) {
          return rawUrl;
        }

        if (url.protocol !== 'https:' && url.protocol !== 'http:') return rawUrl;
        if (url.hostname.endsWith('.translate.goog')) return rawUrl;

        var translated = new URL(
          'https://' + url.hostname.replace(/\./g, '-') + '.translate.goog' + url.pathname
        );
        url.searchParams.forEach(function (value, key) {
          translated.searchParams.set(key, value);
        });
        translated.searchParams.set('_x_tr_sl', 'de');
        translated.searchParams.set('_x_tr_tl', 'it');
        translated.searchParams.set('_x_tr_hl', 'it');
        translated.hash = url.hash;
        return translated.toString();
      }

      document.querySelectorAll('.source-line a, .inline-source').forEach(function (link) {
        var originalUrl = link.getAttribute('href');
        if (!originalUrl) return;

        var markedGerman = link.querySelector('.source-lang') &&
          link.querySelector('.source-lang').textContent.trim().toUpperCase() === 'D';
        var parsed;
        try { parsed = new URL(originalUrl, window.location.href); } catch (error) { return; }

        if (markedGerman || isGermanHost(parsed.hostname)) {
          link.setAttribute('href', translateUrl(parsed.href));
          link.setAttribute('data-original-url', parsed.href);
        }
      });
    });
  </script>

  {% if site.google_analytics_id %}
 <!-- Global site tag (gtag.js) - Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics_id }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', '{{ site.google_analytics_id }}');
</script>
  {% endif %}

  {% seo %}
</head>
